name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

      - name: Compile Python sources
        run: uv run python -m compileall -q Harness app main.py storage.py LLManager.py
