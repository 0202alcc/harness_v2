name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

      - name: Compile Python sources
        run: uv run python -m compileall -q Harness app main.py storage.py LLManager.py

      - name: Build ROS runtime image
        run: docker build --tag harness-ros:ci --file Dockerfile.ros .

  open_main_promotion_pr:
    name: Open staging promotion PR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Open a main PR when none is already pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --base main --head staging --state open --json number --jq 'length')"
          if [ "$existing" -eq 0 ]; then
            gh pr create \
              --base main \
              --head staging \
              --title "Promote staging to main" \
              --body "Automated promotion after successful staging CI."
          else
            echo "An open staging-to-main PR already exists."
          fi
