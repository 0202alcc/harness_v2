<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local LLM Interface</title>
</head>
<body>

    <h2>LLM Chat</h2>
    <form action="/" method="get">
        <label for="chat_id">Chat:</label>
        <select id="chat_id" name="chat_id" onchange="this.form.submit()">
            {% for chat in chat_list %}
                <option value="{{ chat.chat_id }}" {% if chat.chat_id == selected_chat_id %}selected{% endif %}>
                    {{ chat.chat_id[:8] }} ({{ chat.message_count }} messages)
                </option>
            {% endfor %}
        </select>
        <noscript><button type="submit">Open</button></noscript>
    </form>
    <form action="/chats" method="post">
        <button type="submit">New chat</button>
    </form>
    <pre id="chat-data">{{ chat_metadata }}</pre>
    <div class="messages">
        {% for msg in chat_data.messages %}
            <div class="message {{ msg.role }}">
                <div class="message-meta">
                    <strong>{{ msg.role | capitalize }}</strong>
                    <small>#{{ msg.sequence_number }}</small>
                </div>

                <div class="message-content">
                    {{ msg.content }}
                </div>
            </div>
        {% endfor %}
    </div>

    <form id="chat-form" action="/send" method="post">
        <input type="hidden" name="chat_id" value="{{ selected_chat_id }}">
        <div class="form-group">
            <label for="system_prompt">System Prompt (optional):</label>
            <input type="text" id="system_prompt" name="system_prompt" value="{{ chat_data.system_prompt or '' }}" placeholder="Uses the existing prompt when left blank">
            <label>
                <input type="checkbox" name="disable_system_prompt">
                Disable system prompt for this conversation
            </label>
        </div>

        <div class="form-group">
            <label for="message">Message:</label>
            <input type="text" id="message" name="message" value="{{ message if message else '' }}" required>
        </div>

        <button type="submit">Send</button>
    </form>

    <div id="result" class="result" hidden></div>

    <details id="issue-report">
        <summary>Report a problem</summary>
        <form id="issue-form">
            <input type="hidden" name="chat_id" value="{{ selected_chat_id }}">
            <input type="hidden" id="issue-run-id" name="run_id">
            <label for="issue-title">Title:</label>
            <input id="issue-title" name="title" required placeholder="Short description of the problem">
            <label for="issue-description">What happened?</label>
            <textarea id="issue-description" name="description" rows="4" placeholder="What you expected, what you saw, and any useful context."></textarea>
            <label>
                <input type="checkbox" name="include_trace" required>
                Attach this run's raw llama.cpp trace. It can include message and model-output text.
            </label>
            <button id="issue-submit" type="submit" disabled>Submit GitHub issue</button>
            <div id="issue-status" hidden></div>
        </form>
    </details>

    <script>
        const form = document.getElementById("chat-form");
        const result = document.getElementById("result");
        const messages = document.querySelector(".messages");
        const issueForm = document.getElementById("issue-form");
        const issueRunId = document.getElementById("issue-run-id");
        const issueSubmit = document.getElementById("issue-submit");
        const issueStatus = document.getElementById("issue-status");
        let activeUserMessage = null;
        let activeThoughtContent = null;
        let activeResponseContent = null;
        let observationSequence = 0;
        let eventCursor = {{ event_cursor }};
        let sessionSocket = null;

        function makeRunReportable(runId) {
            if (!runId) return;
            issueRunId.value = runId;
            issueSubmit.disabled = false;
        }

        function scrollToBottom(behavior = "smooth") {
            window.scrollTo({
                top: document.documentElement.scrollHeight,
                behavior,
            });
        }

        window.addEventListener("load", () => scrollToBottom("auto"));

        function createUserMessage() {
            const message = document.createElement("div");
            message.className = "message user";
            const meta = document.createElement("div");
            meta.className = "message-meta";
            meta.textContent = "User";
            const body = document.createElement("div");
            body.className = "message-content";
            message.append(meta, body);
            messages.append(message);
            return body;
        }

        function appendChunkAndAnnotation(eventData) {
            if (!activeUserMessage) activeUserMessage = createUserMessage();

            const chunk = document.createElement("span");
            chunk.className = "source-chunk";
            chunk.textContent = eventData.chunk_text;
            activeUserMessage.append(chunk);

            const quote = document.createElement("blockquote");
            quote.id = `annotation-${eventData.chunk_index}`;
            const label = document.createElement("strong");
            label.textContent = `Annotation ${eventData.chunk_index + 1}`;
            const content = document.createElement("pre");
            quote.append(label, content);
            activeUserMessage.append(quote);
        }

        function startThoughtProcess() {
            if (!activeUserMessage) activeUserMessage = createUserMessage();
            const details = document.createElement("details");
            details.open = true;
            const summary = document.createElement("summary");
            summary.textContent = "Complete thought process";
            const content = document.createElement("pre");
            details.append(summary, content);
            activeUserMessage.append(details);
            activeThoughtContent = content;
        }

        function appendThoughtProcess(text) {
            if (!activeThoughtContent) startThoughtProcess();
            activeThoughtContent.textContent += text;
        }

        function startAssistantResponse() {
            const message = document.createElement("div");
            message.className = "message assistant";
            const meta = document.createElement("div");
            meta.className = "message-meta";
            meta.textContent = "Assistant";
            const body = document.createElement("div");
            body.className = "message-content";
            message.append(meta, body);
            messages.append(message);
            activeResponseContent = body;
        }

        function appendAssistantResponse(text) {
            if (!activeResponseContent) startAssistantResponse();
            activeResponseContent.textContent += text;
        }

        function handleAlwaysOnEvent(eventData) {
            if (eventData.type === "inference_feedback") {
                const feedback = eventData.event;
                if (feedback.type === "annotation_start") {
                    appendChunkAndAnnotation(feedback);
                } else if (feedback.type === "annotation_delta") {
                    const annotation = document.querySelector(`#annotation-${feedback.chunk_index} pre`);
                    if (annotation) annotation.textContent += feedback.content;
                } else if (feedback.type === "annotation_replace") {
                    const annotation = document.querySelector(`#annotation-${feedback.chunk_index} pre`);
                    if (annotation) annotation.textContent = feedback.content;
                } else if (feedback.type === "thought_process_start") {
                    startThoughtProcess();
                } else if (feedback.type === "thought_process_delta") {
                    appendThoughtProcess(feedback.content);
                } else if (feedback.type === "thought_process_replace") {
                    if (!activeThoughtContent) startThoughtProcess();
                    activeThoughtContent.textContent = feedback.content;
                } else if (feedback.type === "response_start") {
                    startAssistantResponse();
                } else if (feedback.type === "response_delta") {
                    appendAssistantResponse(feedback.content);
                } else if (feedback.type === "response_replace") {
                    if (!activeResponseContent) startAssistantResponse();
                    activeResponseContent.textContent = feedback.content;
                } else if (feedback.type === "response_complete") {
                    if (!activeResponseContent) appendAssistantResponse(feedback.text);
                    scrollToBottom();
                }
                return;
            }

            if (eventData.type !== "session_event") return;
            const event = eventData.event;
            eventCursor = Math.max(eventCursor, event.event_number ?? eventCursor);
            const data = event.changes?.[0]?.data || {};
            if (event.event_type === "inference_completed") {
                makeRunReportable(data.run_id);
                if (!activeResponseContent) appendAssistantResponse(data.response || "");
                result.textContent = "Response completed.";
                result.hidden = false;
                scrollToBottom();
            } else if (event.event_type === "inference_failed") {
                result.textContent = data.message || "Inference failed.";
                result.hidden = false;
            } else if (event.event_type === "inference_discarded") {
                result.textContent = "A previous response was superseded by newer input.";
                result.hidden = false;
            }
        }

        function connectSessionSocket() {
            const scheme = location.protocol === "https:" ? "wss" : "ws";
            const sessionId = {{ selected_chat_id | tojson }};
            sessionSocket = new WebSocket(
                `${scheme}://${location.host}/ws/sessions/${sessionId}?after_event_number=${eventCursor}`
            );
            sessionSocket.onmessage = (message) => handleAlwaysOnEvent(JSON.parse(message.data));
            sessionSocket.onclose = () => {
                window.setTimeout(connectSessionSocket, 1000);
            };
        }

        connectSessionSocket();

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            activeUserMessage = null;
            activeThoughtContent = null;
            activeResponseContent = null;
            result.hidden = true;
            const button = form.querySelector("button");
            button.disabled = true;
            const formData = new FormData(form);
            form.elements.message.value = "";

            try {
                if (sessionSocket && sessionSocket.readyState === WebSocket.OPEN) {
                    sessionSocket.send(JSON.stringify({
                        type: "text_observation",
                        content: formData.get("message"),
                        source_id: "web",
                        sequence: ++observationSequence,
                    }));
                    return;
                }
                const response = await fetch("/send", {
                    method: "POST",
                    body: formData,
                });
                if (!response.ok || !response.body) throw new Error("Could not start annotation stream.");

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const messages = buffer.split("\n\n");
                    buffer = messages.pop();
                    for (const message of messages) {
                        if (!message.startsWith("data: ")) continue;
                        const eventData = JSON.parse(message.slice(6));
                        if (eventData.type === "annotation_start") {
                            appendChunkAndAnnotation(eventData);
                        } else if (eventData.type === "annotation_delta") {
                            const annotation = document.querySelector(`#annotation-${eventData.chunk_index} pre`);
                            if (annotation) annotation.textContent += eventData.content;
                        } else if (eventData.type === "annotation_replace") {
                            const annotation = document.querySelector(`#annotation-${eventData.chunk_index} pre`);
                            if (annotation) annotation.textContent = eventData.content;
                        } else if (eventData.type === "thought_process_start") {
                            startThoughtProcess();
                        } else if (eventData.type === "thought_process_delta") {
                            appendThoughtProcess(eventData.content);
                        } else if (eventData.type === "thought_process_replace") {
                            if (!activeThoughtContent) startThoughtProcess();
                            activeThoughtContent.textContent = eventData.content;
                        } else if (eventData.type === "thought_process_complete") {
                            if (!activeThoughtContent) appendThoughtProcess(eventData.text);
                        } else if (eventData.type === "response_start") {
                            startAssistantResponse();
                        } else if (eventData.type === "response_delta") {
                            appendAssistantResponse(eventData.content);
                        } else if (eventData.type === "response_replace") {
                            if (!activeResponseContent) startAssistantResponse();
                            activeResponseContent.textContent = eventData.content;
                        } else if (eventData.type === "response_complete") {
                            if (!activeResponseContent) appendAssistantResponse(eventData.text);
                            scrollToBottom();
                        } else if (eventData.type === "error") {
                            makeRunReportable(eventData.run_id);
                            throw new Error(eventData.message);
                        } else if (eventData.type === "complete") {
                            const data = eventData.result;
                            makeRunReportable(data.run_id);
                            result.textContent = `Message split into ${data.chunk_count} chunk(s), ${data.total_tokens} tokens. Generated ${data.annotation_count} annotation(s).`;
                            result.hidden = false;
                        }
                    }
                }
            } catch (error) {
                result.textContent = error.message;
                result.hidden = false;
            } finally {
                button.disabled = false;
            }
        });

        issueForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            issueSubmit.disabled = true;
            issueStatus.hidden = false;
            issueStatus.textContent = "Creating GitHub issue…";
            try {
                const response = await fetch("/issues", {
                    method: "POST",
                    body: new FormData(issueForm),
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Could not create GitHub issue.");
                issueStatus.textContent = "Issue created: ";
                const link = document.createElement("a");
                link.href = data.url;
                link.textContent = `#${data.number}`;
                link.target = "_blank";
                link.rel = "noreferrer";
                issueStatus.append(link);
            } catch (error) {
                issueStatus.textContent = error.message;
                issueSubmit.disabled = false;
            }
        });
    </script>

</body>
</html>
