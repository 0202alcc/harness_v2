<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local LLM Interface</title>
</head>
<body>

    <h2>LLM Chat</h2>

    <form action="/send" method="post">
        <div class="form-group">
            <label for="system_prompt">System Prompt:</label>
            <input type="text" id="system_prompt" name="system_prompt" value="{{ system_prompt if system_prompt else '' }}" required>
        </div>

        <div class="form-group">
            <label for="message">Message:</label>
            <input type="text" id="message" name="message" value="{{ message if message else '' }}" required>
        </div>

        <button type="send">send</button>
    </form>

    {% if reply %}
    <div class="result">
        <strong>Result:</strong> {{ reply }}
    </div>
    {% endif %}

</body>
</html>
