<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Form Example</title>
</head>
<body>

    <h2>FastAPI Input Form</h2>

    <form action="/send" method="post">
        <div class="form-group">
            <label for="field1">Field 1:</label>
            <input type="text" id="field1" name="field1" value="{{ field1 if field1 else '' }}" required>
        </div>

        <div class="form-group">
            <label for="field2">Field 2:</label>
            <input type="text" id="field2" name="field2" value="{{ field2 if field2 else '' }}" required>
        </div>

        <button type="send">send</button>
    </form>

    {% if reply %}
    <div class="result">
        <strong>Result:</strong> {{ reply }}
    </div>
    {% endif %}

</body>
</html>
